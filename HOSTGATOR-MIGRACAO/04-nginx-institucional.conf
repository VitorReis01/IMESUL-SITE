# ============================================================================
# IMESUL institucional — vhost Nginx (reverse proxy para o Next.js standalone na 3002)
# Destino: /etc/nginx/conf.d/imesul-institucional.conf (AlmaLinux/RHEL)
# ============================================================================
# Troque SEU_DOMINIO_INSTITUCIONAL pelo domínio real (ex.: grupoimesul.com.br
# e www.grupoimesul.com.br, ou o que for decidido em 10-dns-cutover.md).
# Mesmo racional de 03-nginx-vendas.conf: bloco HTTPS comentado até o certbot.
# ============================================================================

upstream imesul_institucional_upstream {
    server 127.0.0.1:3002 fail_timeout=5s max_fails=3;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=imesul_inst_rl:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO_INSTITUCIONAL www.SEU_DOMINIO_INSTITUCIONAL;

    access_log /var/log/imesul/institucional-access.log;
    error_log  /var/log/imesul/institucional-error.log warn;

    client_max_body_size 5m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # return 301 https://$host$request_uri;  # habilitar só depois do certificado

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
        application/x-javascript text/xml application/xml application/xml+rss
        text/javascript image/svg+xml font/woff2;
    gzip_vary on;

    location /_next/static/ {
        proxy_pass http://imesul_institucional_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_req zone=imesul_inst_rl burst=40 nodelay;
    }

    location /_next/image {
        proxy_pass http://imesul_institucional_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600" always;
        limit_req zone=imesul_inst_rl burst=15 nodelay;
    }

    location / {
        proxy_pass http://imesul_institucional_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        limit_req zone=imesul_inst_rl burst=20 nodelay;
    }

    location = /api/health {
        proxy_pass http://imesul_institucional_upstream;
        access_log off;
    }

    # Rota cross-origin usada pelos CTAs do institucional (POST direto no vendas,
    # não passa por aqui) — nada a fazer neste vhost além de servir o front normal.
}

