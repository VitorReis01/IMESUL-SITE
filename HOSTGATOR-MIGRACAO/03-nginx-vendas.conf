# ============================================================================
# IMESUL-VENDAS — vhost Nginx (reverse proxy para o Next.js standalone na 3001)
# Destino: /etc/nginx/conf.d/imesul-vendas.conf (AlmaLinux/RHEL — sem sites-enabled)
# ============================================================================
# Antes de instalar: troque SEU_DOMINIO_VENDAS pelo domínio real (ex.:
# vendas.grupoimesul.com.br, ou o que for decidido em 10-dns-cutover.md).
# O bloco HTTPS está comentado — só habilitar depois do certbot (item 7), com
# o DNS já apontando para esta VPS.
#
# server_tokens off (oculta versão do Nginx nos headers) fica no bloco http{}
# principal (/etc/nginx/nginx.conf) — não repetir por vhost.
# ============================================================================

# Cache de path para reduzir I/O ao checar arquivo estático inexistente (opcional).
# map $sent_http_content_type $expires_static { default off; }

upstream imesul_vendas_upstream {
    server 127.0.0.1:3001 fail_timeout=5s max_fails=3;
    keepalive 16;
}

# Zona de rate limit dedicada a este app (ver 12-seguranca.md para o racional
# dos valores — generosa o bastante para não travar navegação normal nem o
# carrossel de imagens do catálogo, mas corta rajada crua tipo scraper/bot).
limit_req_zone $binary_remote_addr zone=imesul_vendas_rl:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO_VENDAS www.SEU_DOMINIO_VENDAS;

    access_log /var/log/imesul/vendas-access.log;
    error_log  /var/log/imesul/vendas-error.log warn;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # ---- Redirect HTTP -> HTTPS (habilitar só depois do certificado emitido) ----
    # return 301 https://$host$request_uri;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
        application/x-javascript text/xml application/xml application/xml+rss
        text/javascript image/svg+xml font/woff2;
    gzip_vary on;

    # ---- Assets versionados por hash: cache máximo, imutável ----
    location /_next/static/ {
        proxy_pass http://imesul_vendas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_req zone=imesul_vendas_rl burst=40 nodelay;
    }

    # ---- Imagens otimizadas on-demand: cache curto (evita reprocessar toda hora,
    # mas sem imutabilidade porque a mesma URL pode mudar se o arquivo de origem mudar) ----
    location /_next/image {
        proxy_pass http://imesul_vendas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600" always;
        # Rate limit mais restrito aqui: foi a rota que coincidiu com a queda
        # observada na infra atual sob rajada (ver 01-inventario.md §1.8).
        limit_req zone=imesul_vendas_rl burst=15 nodelay;
    }

    location / {
        proxy_pass http://imesul_vendas_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        limit_req zone=imesul_vendas_rl burst=20 nodelay;
    }

    location = /api/health {
        proxy_pass http://imesul_vendas_upstream;
        access_log off;  # monitor bate aqui a cada poucos minutos; não polui o log
    }
}

